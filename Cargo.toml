[package]
name = "amberol"
authors = ["Emmanuele Bassi <ebassi@gnome.org>", "Shashwat <shanks>"]
version = "2026.7.0"
edition = "2021"
description = "Ember — a cinematic music player for Linux & Windows"
license = "GPL-3.0-or-later"
repository = "https://github.com/shanksshael-sudo/Ember"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
color-thief = "0.2.1"
gdk-pixbuf = { version = "0.21", features = ["v2_42"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_16"] }
itertools = "0.14"
lofty = "0.23.3"
log = "0.4"
once_cell = "1.10"
pretty_env_logger = "0.5"
rand = { version = "0.9", features = ["thread_rng"]}
regex = "1.3.4"
serde_json = "1.0"
sha2 = "0.10.2"
fuzzy-matcher = "0.3.7"
async-channel = "2.2.0"
futures = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
ashpd = {version = "0.12", default-features = false, features = ["gtk4", "async-std"]}
mpris-server = "0.8"

[dependencies.gst]
package = "gstreamer"
version = "0.24"

[dependencies.gst-audio]
package = "gstreamer-audio"
version = "0.24"

[dependencies.gst-play]
package = "gstreamer-play"
version = "0.24"
